<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inscription – Visite de groupe</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #f5f4f0; color: #1a1a18; min-height: 100vh; padding: 1.5rem 1rem 3rem; }
  .container { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 22px; font-weight: 600; margin-bottom: 0.25rem; }
  .subtitle { font-size: 14px; color: #6b6b65; margin-bottom: 1.5rem; line-height: 1.5; }
  .card { background: #fff; border: 1px solid #e3e2dc; border-radius: 12px; padding: 1.25rem; margin-bottom: 1rem; }
  .section-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: #9b9b93; margin-bottom: 0.75rem; }
  label { font-size: 14px; color: #4a4a45; display: block; margin-bottom: 4px; }
  input[type=text], input[type=email], input[type=number], select {
    width: 100%; padding: 9px 12px; border: 1px solid #d8d7d0; border-radius: 8px;
    font-size: 14px; color: #1a1a18; background: #fafaf8; outline: none;
    transition: border-color 0.15s; margin-bottom: 0.75rem;
  }
  input:focus, select:focus { border-color: #534AB7; background: #fff; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .btn-group { display: flex; gap: 8px; margin-bottom: 1rem; }
  .btn-toggle {
    flex: 1; padding: 10px; border: 1px solid #d8d7d0; border-radius: 8px;
    background: #fafaf8; color: #4a4a45; font-size: 14px; cursor: pointer; transition: all 0.15s;
  }
  .btn-toggle:hover:not(.active) { background: #f0efe8; }
  .btn-toggle.active { background: #EEEDFE; border-color: #534AB7; color: #3C3489; font-weight: 500; }
  .creneau-item {
    width: 100%; padding: 10px 14px; border: 1px solid #d8d7d0; border-radius: 8px;
    background: #fafaf8; color: #1a1a18; font-size: 14px; cursor: pointer;
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 8px; transition: all 0.15s; text-align: left;
  }
  .creneau-item:hover:not(:disabled) { background: #f0efe8; border-color: #b8b7b0; }
  .creneau-item.selected { background: #EEEDFE; border-color: #534AB7; color: #3C3489; }
  .creneau-item:disabled { opacity: 0.45; cursor: not-allowed; background: #f5f4f0; }
  .badge { font-size: 12px; padding: 2px 8px; border-radius: 20px; font-weight: 500; }
  .badge-ok   { background: #EAF3DE; color: #3B6D11; }
  .badge-low  { background: #FAEEDA; color: #854F0B; }
  .badge-full { background: #FCEBEB; color: #A32D2D; }
  .submit-btn {
    width: 100%; padding: 13px; border: none; border-radius: 10px;
    background: #534AB7; color: #fff; font-size: 15px; font-weight: 600;
    cursor: pointer; transition: background 0.15s; margin-top: 0.25rem;
  }
  .submit-btn:hover { background: #3C3489; }
  .submit-btn:disabled { background: #b0aed8; cursor: not-allowed; }
  .msg { padding: 1rem 1.25rem; border-radius: 10px; margin-bottom: 1rem; font-size: 14px; line-height: 1.6; }
  .msg-error   { background: #FCEBEB; color: #A32D2D; border: 1px solid #F09595; }
  .msg-success { background: #EAF3DE; color: #27500A; border: 1px solid #97C459; }
  .hidden { display: none !important; }
  .accomp-block { border-top: 1px solid #f0efe8; margin-top: 0.75rem; padding-top: 0.75rem; }
  .accomp-title { font-size: 13px; font-weight: 600; color: #4a4a45; margin-bottom: 0.5rem; }
  .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.4); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading { text-align: center; padding: 2rem; color: #9b9b93; font-size: 14px; }
</style>
</head>
<body>
<div class="container">

  <div id="msgBox" class="hidden"></div>
  <div id="loadingState" class="loading">Chargement des créneaux…</div>

  <div id="formWrap" class="hidden">
    <h1>Inscription à la visite</h1>
    <p class="subtitle">Répondez à ce formulaire pour confirmer votre participation à l'événement.</p>

    <div class="card">
      <div class="section-label">Participation</div>
      <label>Venez-vous à l'événement ?</label>
      <div class="btn-group">
        <button class="btn-toggle" id="btnOui" onclick="setVient(true)">Oui, je viens</button>
        <button class="btn-toggle" id="btnNon" onclick="setVient(false)">Non, je ne viens pas</button>
      </div>
    </div>

    <div id="formOui" class="hidden">
      <div class="card">
        <div class="section-label">Vos coordonnées</div>
        <div class="row">
          <div><label>Nom *</label><input type="text" id="nom" placeholder="Dupont"></div>
          <div><label>Prénom *</label><input type="text" id="prenom" placeholder="Marie"></div>
        </div>
        <label>Email *</label>
        <input type="email" id="email" placeholder="marie.dupont@email.com" style="margin-bottom:0">
      </div>

      <div class="card">
        <div class="section-label">Accompagnants</div>
        <label>Nombre d'accompagnants</label>
        <select id="nbAccomp" onchange="updateAccomp()">
          <option value="0">0 – Je viens seul(e)</option>
          <option value="1">1 accompagnant</option>
          <option value="2">2 accompagnants</option>
          <option value="3">3 accompagnants</option>
          <option value="4">4 accompagnants</option>
        </select>
        <div id="accompList"></div>
      </div>

      <div class="card">
        <div class="section-label">Type de participation</div>
        <div class="btn-group">
          <button class="btn-toggle" id="btnVR" onclick="setChoix('VR')">Visite + repas</button>
          <button class="btn-toggle" id="btnRO" onclick="setChoix('RO')">Repas uniquement</button>
        </div>
        <div id="creneauxBlock" class="hidden">
          <div class="section-label" style="margin-top:0.5rem">Créneau de visite</div>
          <div id="creneauxList"></div>
          <p style="font-size:12px;color:#9b9b93;margin-top:4px">Les places sont mises à jour en temps réel.</p>
        </div>
      </div>

      <button class="submit-btn" id="submitBtn" onclick="submitOui()">Envoyer mon inscription</button>
    </div>

    <div id="formNon" class="hidden">
      <div class="card">
        <p style="font-size:14px;color:#6b6b65;margin-bottom:1rem">Merci de confirmer votre absence.</p>
        <button class="submit-btn" onclick="submitNon(event)">Confirmer mon absence</button>
      </div>
    </div>
  </div>

</div>
<script>
const AIRTABLE_TOKEN     = 'patO5hUwOXbyR5Hbt.028c4706f37aa54d98b3148cac7ee4c063fb94a7d9c0e103b2c26a3c3e2a1989';
const BASE_ID            = 'apps7Iv0wxzheMlj1';
const TABLE_CRENEAUX     = 'Créneaux visite';
const TABLE_INSCRIPTIONS = 'Inscriptions visite';

const HEADERS = {
  'Authorization': `Bearer ${AIRTABLE_TOKEN}`,
  'Content-Type': 'application/json'
};

let creneaux = [];
let inscriptions = [];
let vient = null, choix = null, creneauSelId = null;

async function init() {
  try {
    await Promise.all([loadCreneaux(), loadInscriptions()]);
    document.getElementById('loadingState').classList.add('hidden');
    document.getElementById('formWrap').classList.remove('hidden');
  } catch(e) {
    document.getElementById('loadingState').innerHTML = '❌ Impossible de charger les données. Vérifiez votre connexion.';
    console.error(e);
  }
}

async function loadCreneaux() {
  const url = `https://api.airtable.com/v0/${BASE_ID}/${encodeURIComponent(TABLE_CRENEAUX)}?sort[0][field]=Ordre&sort[0][direction]=asc`;
  const r = await fetch(url, { headers: HEADERS });
  if (!r.ok) throw new Error('Erreur créneaux');
  const data = await r.json();
  creneaux = data.records.map(rec => ({
    airtableId: rec.id,
    label: rec.fields.Title || '',
    capacite: rec.fields.Capacite || 20
  }));
}

async function loadInscriptions() {
  const filter = encodeURIComponent(`{Statut}="Validé"`);
  const url = `https://api.airtable.com/v0/${BASE_ID}/${encodeURIComponent(TABLE_INSCRIPTIONS)}?filterByFormula=${filter}&fields[]=Creneau&fields[]=NombreTotalPersonnes`;
  const r = await fetch(url, { headers: HEADERS });
  if (!r.ok) throw new Error('Erreur inscriptions');
  const data = await r.json();
  inscriptions = data.records.map(rec => ({
    creneauId: rec.fields.Creneau ? rec.fields.Creneau[0] : null,
    total: rec.fields.NombreTotalPersonnes || 1
  }));
}

function getPlacesRestantes(airtableId) {
  const cr = creneaux.find(c => c.airtableId === airtableId);
  const capacite = cr ? cr.capacite : 20;
  const used = inscriptions.filter(i => i.creneauId === airtableId).reduce((s, i) => s + i.total, 0);
  return capacite - used;
}

function setVient(val) {
  vient = val;
  document.getElementById('btnOui').classList.toggle('active', val === true);
  document.getElementById('btnNon').classList.toggle('active', val === false);
  document.getElementById('formOui').classList.toggle('hidden', !val);
  document.getElementById('formNon').classList.toggle('hidden', val);
  clearMsg();
  if (val && choix === 'VR') renderCreneaux();
}

function setChoix(val) {
  choix = val; creneauSelId = null;
  document.getElementById('btnVR').classList.toggle('active', val === 'VR');
  document.getElementById('btnRO').classList.toggle('active', val === 'RO');
  document.getElementById('creneauxBlock').classList.toggle('hidden', val !== 'VR');
  if (val === 'VR') renderCreneaux();
  clearMsg();
}

function getTotal() { return 1 + parseInt(document.getElementById('nbAccomp').value || 0); }

function renderCreneaux() {
  const total = getTotal();
  const list = document.getElementById('creneauxList');
  list.innerHTML = '';
  creneaux.forEach(cr => {
    const rest = getPlacesRestantes(cr.airtableId);
    const insuff = rest < total;
    let badgeClass = 'badge-ok', badgeTxt = rest + ' places';
    if (rest <= 0)      { badgeClass = 'badge-full'; badgeTxt = 'Complet'; }
    else if (rest <= 5) { badgeClass = 'badge-low';  badgeTxt = rest + ' restante' + (rest > 1 ? 's' : ''); }
    const btn = document.createElement('button');
    btn.className = 'creneau-item' + (creneauSelId === cr.airtableId ? ' selected' : '');
    btn.disabled = insuff;
    btn.innerHTML = `<span>${cr.label}</span><span class="badge ${badgeClass}">${badgeTxt}</span>`;
    btn.onclick = () => { creneauSelId = cr.airtableId; renderCreneaux(); clearMsg(); };
    list.appendChild(btn);
  });
}

function updateAccomp() {
  const n = parseInt(document.getElementById('nbAccomp').value);
  const list = document.getElementById('accompList');
  list.innerHTML = '';
  for (let i = 1; i <= n; i++) {
    const d = document.createElement('div');
    d.className = 'accomp-block';
    d.innerHTML = `<div class="accomp-title">Accompagnant ${i}</div>
      <div class="row">
        <div><label>Nom</label><input type="text" id="a${i}nom" placeholder="Nom"></div>
        <div><label>Prénom</label><input type="text" id="a${i}prenom" placeholder="Prénom"></div>
      </div>
      <label>Âge</label><input type="number" id="a${i}age" placeholder="Ex : 35" min="0" max="120" style="width:120px">`;
    list.appendChild(d);
  }
  if (choix === 'VR') renderCreneaux();
}

function showMsg(txt, type) {
  const b = document.getElementById('msgBox');
  b.className = 'msg ' + (type === 'error' ? 'msg-error' : 'msg-success');
  b.innerHTML = txt;
  b.classList.remove('hidden');
  b.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}
function clearMsg() { document.getElementById('msgBox').classList.add('hidden'); }

async function submitNon(e) {
  const btn = e.target;
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Envoi…';
  try {
    await createRecord({ Vient: 'NON', Statut: 'Absent' });
    document.getElementById('formWrap').classList.add('hidden');
    showMsg('Votre absence a bien été enregistrée. Merci !', 'success');
  } catch(err) {
    showMsg('Une erreur est survenue. Veuillez réessayer.', 'error');
    btn.disabled = false; btn.innerHTML = 'Confirmer mon absence';
  }
}

async function submitOui() {
  clearMsg();
  const nom = document.getElementById('nom').value.trim();
  const prenom = document.getElementById('prenom').value.trim();
  const email = document.getElementById('email').value.trim();
  if (!nom || !prenom || !email) { showMsg('Merci de renseigner votre nom, prénom et email.', 'error'); return; }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showMsg("L'adresse email ne semble pas valide.", 'error'); return; }
  if (!choix) { showMsg('Merci de choisir votre type de participation.', 'error'); return; }
  if (choix === 'VR' && !creneauSelId) { showMsg('Merci de choisir un créneau de visite.', 'error'); return; }

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Vérification…';

  // Vérification doublon email
  try {
    const filterEmail = encodeURIComponent(`{Email}="${email}"`);
    const urlCheck = `https://api.airtable.com/v0/${BASE_ID}/${encodeURIComponent(TABLE_INSCRIPTIONS)}?filterByFormula=${filterEmail}&fields[]=Email`;
    const rCheck = await fetch(urlCheck, { headers: HEADERS });
    if (rCheck.ok) {
      const dataCheck = await rCheck.json();
      if (dataCheck.records && dataCheck.records.length > 0) {
        showMsg('Une inscription existe déjà pour cette adresse email.', 'error');
        btn.disabled = false; btn.innerHTML = 'Envoyer mon inscription'; return;
      }
    }
  } catch(e) { console.warn('Vérification doublon échouée', e); }

  if (choix === 'VR') {
    await loadInscriptions();
    const rest = getPlacesRestantes(creneauSelId);
    const total = getTotal();
    if (rest < total) {
      showMsg("Désolé, ce créneau vient d'être complet. Merci d'en choisir un autre.", 'error');
      creneauSelId = null; renderCreneaux();
      btn.disabled = false; btn.innerHTML = 'Envoyer mon inscription'; return;
    }
  }

  btn.innerHTML = '<span class="spinner"></span>Enregistrement…';
  const n = parseInt(document.getElementById('nbAccomp').value);
  const total = getTotal();

  const fields = {
    Nom: nom, Prenom: prenom, Email: email,
    Vient: 'OUI', NombreAccompagnants: n, NombreTotalPersonnes: total,
    ChoixParticipation: choix === 'VR' ? 'Visite + repas' : 'Repas uniquement',
    Statut: 'Validé'
  };
  if (choix === 'VR' && creneauSelId) fields['Creneau'] = [creneauSelId];
  for (let i = 1; i <= n; i++) {
    fields[`Accompagnant${i}Nom`]    = (document.getElementById(`a${i}nom`)    || {}).value || '';
    fields[`Accompagnant${i}Prenom`] = (document.getElementById(`a${i}prenom`) || {}).value || '';
    const age = parseInt((document.getElementById(`a${i}age`) || {}).value);
    if (!isNaN(age)) fields[`Accompagnant${i}Age`] = age;
  }

  try {
    await createRecord(fields);
    const cr = creneaux.find(c => c.airtableId === creneauSelId);
    const detail = choix === 'VR'
      ? `<br><br><strong>Participation :</strong> Visite + repas<br><strong>Personnes :</strong> ${total}<br><strong>Créneau :</strong> ${cr ? cr.label : ''}`
      : `<br><br><strong>Participation :</strong> Repas uniquement<br><strong>Personnes :</strong> ${total}`;
    document.getElementById('formWrap').classList.add('hidden');
    showMsg(`Votre inscription a bien été enregistrée, merci ${prenom} !${detail}`, 'success');
  } catch(err) {
    showMsg("Une erreur est survenue lors de l'enregistrement. Veuillez réessayer.", 'error');
    btn.disabled = false; btn.innerHTML = 'Envoyer mon inscription';
  }
}

async function createRecord(fields) {
  const url = `https://api.airtable.com/v0/${BASE_ID}/${encodeURIComponent(TABLE_INSCRIPTIONS)}`;
  const r = await fetch(url, { method: 'POST', headers: HEADERS, body: JSON.stringify({ fields }) });
  if (!r.ok) { const err = await r.json(); throw new Error(err.error?.message || 'Airtable error'); }
  return r.json();
}

init();
</script>
</body>
</html>
